name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ secrets.PGUSER_TEST || 'developer' }}
          POSTGRES_PASSWORD: ${{ secrets.PGPASSWORD_TEST || 'supersecretpassword' }}
          POSTGRES_DB: ${{ secrets.PGDATABASE_TEST || 'forumapi_test' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm install

      - name: Create .test.env file
        run: |
          echo "HOST=localhost" >> .test.env
          echo "PORT=3000" >> .test.env
          echo "PGHOST=${{ secrets.PGHOST_TEST || 'localhost' }}" >> .test.env
          echo "PGUSER=${{ secrets.PGUSER_TEST || 'developer' }}" >> .test.env
          echo "PGDATABASE=${{ secrets.PGDATABASE_TEST || 'forumapi_test' }}" >> .test.env
          echo "PGPASSWORD=${{ secrets.PGPASSWORD_TEST || 'supersecretpassword' }}" >> .test.env
          echo "PGPORT=${{ secrets.PGPORT_TEST || '5432' }}" >> .test.env
          echo "PGHOST_TEST=${{ secrets.PGHOST_TEST || 'localhost' }}" >> .test.env
          echo "PGUSER_TEST=${{ secrets.PGUSER_TEST || 'developer' }}" >> .test.env
          echo "PGDATABASE_TEST=${{ secrets.PGDATABASE_TEST || 'forumapi_test' }}" >> .test.env
          echo "PGPASSWORD_TEST=${{ secrets.PGPASSWORD_TEST || 'supersecretpassword' }}" >> .test.env
          echo "PGPORT_TEST=${{ secrets.PGPORT_TEST || '5432' }}" >> .test.env
          echo "ACCESS_TOKEN_KEY=${{ secrets.ACCESS_TOKEN_KEY || '8b7b4ef375716ab08b2a3951b29d52fc00b1c855f9d1a847229d271e76a9cf08e614300395c3b90ebe559cf968a0741b18c9505549394b2c70' }}" >> .test.env
          echo "REFRESH_TOKEN_KEY=${{ secrets.REFRESH_TOKEN_KEY || '5078605e074a462b1460608fcbe0d0963c644402e04ad334455ff5a856cb43fd99825861dde02957d5e3184c90c532ca7d0249df20fe93d535632f3d11be7bad' }}" >> .test.env
          echo "ACCCESS_TOKEN_AGE=3000" >> .test.env

      - name: Run database migration for test
        run: npm run migrate:test up

      - name: Run linter
        run: npm run lint

      - name: Run automated tests (Unit, Integration, Functional)
        run: npm test

